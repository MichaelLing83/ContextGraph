# docker-compose.yml
# Runs Neo4j instances + LiteLLM proxy (API gateway).
#
# Usage:
#   docker compose up -d                    # Start baseline neo4j + litellm
#   docker compose up -d neo4j              # Baseline only (READ-ONLY)
#   docker compose --profile experiment up -d  # Start all neo4j instances
#   docker compose logs -f litellm          # Follow proxy logs
#
# Neo4j instances:
#   neo4j          (7687) - Baseline, READ-ONLY. 8,910 entries from 1,795 trajectories.
#   neo4j-online   (7690) - Online learning. Treatment writes strategies here.
#
# To create volumes from baseline dump:
#   docker volume create neo4j-contextgraph-online
#   docker run --rm -v neo4j-contextgraph-online:/data -v /tmp:/backup neo4j:5 \
#     neo4j-admin database load neo4j --from-path=/backup --overwrite-destination

services:
  neo4j:
    image: neo4j:5
    container_name: neo4j-contextgraph
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in .env (e.g. neo4j/yourpassword)}
      # READ-ONLY: prevents accidental writes to baseline graph
      NEO4J_server_databases_default__to__read__only: "true"
    volumes:
      - neo4j-contextgraph-data:/data
    restart: unless-stopped

  neo4j-online:
    image: neo4j:5
    container_name: neo4j-contextgraph-online
    profiles: ["experiment"]
    ports:
      - "127.0.0.1:7477:7474"
      - "127.0.0.1:7690:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in .env (e.g. neo4j/yourpassword)}
    volumes:
      - neo4j-contextgraph-online:/data
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./configs/litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env
    restart: unless-stopped

volumes:
  neo4j-contextgraph-data:
    external: true
  neo4j-contextgraph-online:
    external: true
