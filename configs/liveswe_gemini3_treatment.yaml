# live-SWE-agent config: Gemini 3 Pro TREATMENT (with ContextGraph memory)
# Usage: mini --config configs/liveswe_gemini3_treatment.yaml -m openrouter/google/gemini-3-pro-preview
#
# Memory is injected via instance_template. Before each run, the runner script
# replaces {{memory_context}} with the actual ContextGraph query result.

agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.

    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).
    Include a THOUGHT section before your command where you explain your reasoning process.
    Format your response as shown in <format_example>.

    <format_example>
    Your reasoning and analysis here. Explain why you want to perform the action.

    ```bash
    your_command_here
    ```
    </format_example>

    Failure to follow these rules will cause your response to be rejected.
  instance_template: |
    <memory_context>
    The following strategies were retrieved from a knowledge base of past debugging experiences.
    Use them to guide your approach if relevant.

    {{memory_context}}
    </memory_context>

    Please solve this issue: {{task}}

    You can execute bash commands and edit files to implement the necessary changes.

    ## Recommended Workflow

    1. Review the memory context above for relevant strategies
    2. Analyze the codebase by finding and reading relevant files
    3. Create a script to reproduce the issue
    4. Edit the source code to resolve the issue
    5. Verify your fix works by running your script again
    6. Test edge cases to ensure your fix is robust
    7. Submit your changes: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`

    ## Important Rules

    1. Every response must contain exactly one action
    2. The action must be enclosed in triple backticks
    3. Directory or environment variable changes are not persistent.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  action_observation_template: |
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>Output too long. Use head/tail/sed.</warning>
    <output_head>{{ output.output[:5000] }}</output_head>
    <output_tail>{{ output.output[-5000:] }}</output_tail>
    {%- endif -%}
  format_error_template: |
    Please provide EXACTLY ONE action in triple backticks.
  step_limit: 0.
  cost_limit: 5.
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  model_kwargs:
    temperature: 0.0
    drop_params: true
