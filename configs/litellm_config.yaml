# LiteLLM proxy configuration — routes models to appropriate providers.
#
# Claude models → Anthropic API (uses ANTHROPIC_API_KEY, the OAuth token)
# Embedding models → ChatAnywhere (uses CHATANYWHERE_API_KEY)
# GLM models → Zhipu AI (uses ZHIPU_API_KEY)
# GPT models → OpenAI API (reserved, uses OPENAI_API_KEY)
#
# Start: docker compose up -d litellm

model_list:
  # --- Claude models (Anthropic) ---
  - model_name: claude-sonnet-4-20250514
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-5-20250514
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Embedding models (ChatAnywhere) ---
  - model_name: text-embedding-3-large
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/CHATANYWHERE_API_KEY
      api_base: https://api.chatanywhere.org/v1

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/CHATANYWHERE_API_KEY
      api_base: https://api.chatanywhere.org/v1

  # --- GLM models (Zhipu AI) ---
  - model_name: GLM-4.7
    litellm_params:
      model: openai/GLM-4.7
      api_key: os.environ/ZHIPU_API_KEY
      api_base: https://open.bigmodel.cn/api/coding/paas/v4

  # --- GPT models (OpenAI — reserved for GPT Pro) ---
  # Uncomment when GPT Pro subscription is available:
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

general_settings:
  forward_client_headers_to_llm_api: true
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  num_retries: 3
  request_timeout: 300
