tools:
  query_memory:
    signature: |
      query_memory <current_error> <task_description> <phase>
    docstring: >
      Query agent memory for similar past experiences and methodologies.
      Use this tool to get guidance based on previously solved problems.
      Returns relevant methodologies, similar error fragments, and warnings
      from the context graph built from past SWE-agent trajectories.
    arguments:
      - name: current_error
        type: string
        description: "The error message currently being debugged"
        required: true
      - name: task_description
        type: string
        description: "Brief description of the current task"
        required: true
      - name: phase
        type: string
        description: "Current phase of problem solving"
        required: true
        enum: ["exploring", "understanding", "locating", "fixing", "verifying", "testing"]
