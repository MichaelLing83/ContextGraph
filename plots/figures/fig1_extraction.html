<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fig 1 · Experience Extraction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 24px; background: #fff; font-family: "Inter", sans-serif; color: #0f172a; }
  svg { display: block; margin: 0 auto; }
  text { font-family: "Inter", sans-serif; fill: #0f172a; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .panel-title { font-size: 13px; font-weight: 700; letter-spacing: 0.2px; }
  .panel-sub   { font-size: 10px; font-weight: 500; fill: #64748b; }
  .row-tag     { font-size: 10px; font-weight: 600; fill: #fff; }
  .row-body    { font-size: 10.5px; font-weight: 400; fill: #111827; }
  .card-title  { font-size: 10.5px; font-weight: 700; }
  .card-body   { font-size: 10px; font-weight: 400; fill: #334155; }
  .edge        { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  .edge-bold   { stroke: #1f2937; stroke-width: 1.8; fill: none; }
</style>
</head>
<body>
<svg viewBox="0 0 980 340" xmlns="http://www.w3.org/2000/svg" data-figure="extraction"
     font-family="Inter, sans-serif">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arr-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ================= A. Trajectory panel ================= -->
  <g transform="translate(20,20)" data-panel="trajectory">
    <rect width="280" height="300" rx="12" ry="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="24" class="panel-title">A. Agent trajectory</text>
    <text x="20" y="42" class="panel-sub" fill="#64748b">think / act / observe / verify</text>

    <!-- Trajectory steps -->
    <g transform="translate(16,60)">
      <g data-step="think">
        <rect width="248" height="28" rx="5" fill="#eef2ff" stroke="#6366f1"/>
        <text x="12" y="18" font-size="10.5" font-weight="600" fill="#3730a3" font-family="Inter, sans-serif">think</text>
        <text x="60" y="18" font-size="10.5" fill="#111" font-family="Inter, sans-serif">locate failing test</text>
      </g>
      <g transform="translate(0,36)" data-step="tool">
        <rect width="248" height="28" rx="5" fill="#ecfeff" stroke="#0891b2"/>
        <text x="12" y="18" font-size="10.5" font-weight="600" fill="#155e75" font-family="Inter, sans-serif">tool</text>
        <text x="60" y="18" font-size="10" class="mono" fill="#111">pytest -x tests/auth</text>
      </g>
      <g transform="translate(0,72)" data-step="obs">
        <rect width="248" height="28" rx="5" fill="#fef2f2" stroke="#dc2626"/>
        <text x="12" y="18" font-size="10.5" font-weight="600" fill="#991b1b" font-family="Inter, sans-serif">obs</text>
        <text x="60" y="18" font-size="10" class="mono" fill="#111">KeyError: 'exp' at jwt.py:57</text>
      </g>
      <g transform="translate(0,108)">
        <rect width="240" height="28" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="0.8"/>
        <text x="12" y="18" class="label-amber" font-size="10.5" font-weight="600" fill="#9a3412">EDIT</text>
        <text x="64" y="18" font-size="10" font-family="JetBrains Mono, monospace" fill="#431407">jwt.py: +claim validation</text>
      </g>
      <g transform="translate(0,144)">
        <rect width="240" height="28" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8"/>
        <text x="12" y="18" font-size="10.5" font-weight="600" fill="#064e3b">obs</text>
        <text x="64" y="18" font-size="10" font-family="JetBrains Mono, monospace" fill="#064e3b">tests pass ✓</text>
      </g>
    </g>
  </g>

  <!-- Arrow A -->
  <line x1="310" y1="170" x2="370" y2="170" class="arrow" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="340" y="162" font-size="10" fill="#475569" text-anchor="middle" font-style="italic">distill</text>

  <!-- Panel B: Extractor -->
  <g transform="translate(370,20)" data-panel="extractor">
    <rect width="160" height="280" rx="10" fill="#fafaf9" stroke="#d6d3d1" stroke-dasharray="4 3"/>
    <text x="80" y="30" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#0f172a">Extractor</text>
    <text x="80" y="46" text-anchor="middle" style="font-size:10px;fill:#6b7280">(LLM pass)</text>

    <!-- stages -->
    <g transform="translate(18,70)" style="font-size:10.5px;font-weight:500;fill:#111827">
      <rect width="124" height="30" rx="6" fill="#fff" stroke="#e5e7eb"/>
      <text x="62" y="19" text-anchor="middle">segment</text>
    </g>
    <g transform="translate(18,110)" style="font-size:10.5px;font-weight:500;fill:#111827">
      <rect width="124" height="30" rx="6" fill="#fff" stroke="#e5e7eb"/>
      <text x="62" y="19" text-anchor="middle">classify role</text>
    </g>
    <g transform="translate(18,150)" style="font-size:10.5px;font-weight:500;fill:#111827">
      <rect width="124" height="30" rx="6" fill="#fff" stroke="#e5e7eb"/>
      <text x="62" y="19" text-anchor="middle">abstract identifiers</text>
    </g>
    <g transform="translate(16,190)">
      <rect width="148" height="22" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="8" y="15" font-size="10">embed &amp; store</text>
    </g>
  </g>

  <!-- Arrow B -->
  <line x1="560" y1="160" x2="610" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ─── Panel C: Typed experience points ───── -->
  <g transform="translate(620,30)" data-panel="points">
    <text x="0" y="10" class="title">C. Experience points</text>

    <!-- card: strategy -->
    <g transform="translate(0,22)">
      <rect width="250" height="56" rx="8" fill="#eef2ff" stroke="#4338ca"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#3730a3">STRATEGY</text>
      <text x="12" y="36" font-size="10" fill="#1e293b">When JWT validation fails →</text>
      <text x="12" y="50" font-size="10" fill="#1e293b">check server clock &amp; token TTL</text>
    </g>

    <!-- card: pitfall -->
    <g transform="translate(0,88)">
      <rect width="250" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#991b1b">PITFALL</text>
      <text x="12" y="36" font-size="10" fill="#1f2937">django 4.2: session cookie domain</text>
      <text x="12" y="50" font-size="10" fill="#1f2937">defaults changed — update settings.py</text>
    </g>

    <g transform="translate(0,108)">
      <rect width="248" height="42" rx="6" fill="#f0fdf4" stroke="#10b981"/>
      <text x="12" y="18" font-size="10.5" font-weight="700" fill="#047857">TOOL-USE</text>
      <text x="12" y="34" font-size="10" fill="#065f46">prefer <tspan font-family="JetBrains Mono">pytest -x -k name</tspan> to iterate</text>
    </g>

    <g transform="translate(0,162)">
      <rect width="248" height="42" rx="6" fill="#fef3c7" stroke="#d97706"/>
      <text x="12" y="18" font-size="10.5" font-weight="700" fill="#92400e">RESOLUTION</text>
      <text x="12" y="34" font-size="10" fill="#78350f">rerun failing test after migration</text>
    </g>

    <g transform="translate(0,216)">
      <rect width="248" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="12" y="18" font-size="10.5" font-weight="bold" fill="#5b21b6">RULE</text>
      <text x="12" y="34" font-size="10" fill="#1f2937">Validate token schema before commit</text>
    </g>
  </g>

  <!-- connectors from extractor to experience cards -->
  <g stroke="#94a3b8" stroke-width="1" fill="none">
    <path d="M 540 110 C 570 110 580 70 614 70"/>
    <path d="M 540 135 C 570 135 580 135 614 135"/>
    <path d="M 540 165 C 570 165 580 200 614 200"/>
    <path d="M 540 195 C 570 195 580 265 614 265"/>
  </g>

</svg>
</body>
</html>
