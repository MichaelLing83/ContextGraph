<!doctype html>
<meta charset="utf-8">
<title>Fig 1 · Experience Extraction</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 24px; background: #fff; font-family: "Source Sans 3", system-ui, sans-serif; color: #0f172a; }
  svg  { display: block; margin: 0 auto; }
  text.title    { font: 700 13px "Source Sans 3"; }
  text.sub      { font: 500 10.5px "Source Sans 3"; fill: #475569; }
  text.tag      { font: 700 9.5px "Source Sans 3"; }
  text.body     { font: 400 10px "Source Sans 3"; fill: #1f2937; }
  text.code     { font: 500 9.5px "JetBrains Mono"; fill: #1f2937; }
  rect.panel    { fill: #fafafa; stroke: #e5e7eb; stroke-width: 1; }
  rect.extractor{ fill: #ffffff; stroke: #1f2937; stroke-width: 1; stroke-dasharray: 3 3; }
  path.arrow    { stroke: #1f2937; stroke-width: 1.4; fill: none; }
  .card         { stroke-width: 1.2; }
</style>

<svg viewBox="0 0 900 330" width="900" height="330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- A. Trajectory panel -->
  <g transform="translate(20,20)">
    <rect width="280" height="290" rx="10" class="panel"/>
    <text x="20" y="26" class="title">A. Agent trajectory</text>
    <text x="20" y="44" class="sub">thought · action · outcome</text>

    <!-- rows -->
    <g transform="translate(18,62)">
      <!-- t1 -->
      <rect width="240" height="26" rx="4" fill="#eef2ff" stroke="#6366f1" class="card"/>
      <text x="10" y="17" font="10px monospace" fill="#3730a3" font-weight="600">think</text>
      <text x="56" y="17" class="body" fill="#1f2937">locate failing auth test</text>
    </g>
    <g transform="translate(18,94)">
      <rect width="240" height="26" rx="4" fill="#ecfeff" stroke="#0891b2" class="card"/>
      <text x="10" y="17" font="10px monospace" fill="#0e7490" font-weight="600">act</text>
      <text x="56" y="17" class="code">pytest -x tests/auth</text>
    </g>
    <g transform="translate(18,126)">
      <rect width="224" height="22" rx="4" fill="#fee2e2" stroke="#ef4444"/>
      <text x="10" y="15" class="code" fill="#991b1b">✗ AssertionError: token expired</text>
    </g>
    <g transform="translate(18,156)">
      <rect width="224" height="22" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
      <text x="10" y="15" class="tag">reflect</text>
      <text x="60" y="15" class="body">refresh flow broken since v2</text>
    </g>
    <g transform="translate(18,186)">
      <rect width="224" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="10" y="15" class="tag">edit</text>
      <text x="50" y="15" class="code">auth/refresh.py +12 -4</text>
    </g>
    <g transform="translate(18,216)">
      <rect width="224" height="22" rx="4" fill="#dcfce7" stroke="#16a34a"/>
      <text x="10" y="15" class="tag" fill="#065f46">verify</text>
      <text x="58" y="15" class="body" fill="#065f46">✓ 42 passed, 0 failed</text>
    </g>
  </g>

  <!-- arrow A → B -->
  <line x1="282" y1="160" x2="322" y2="160" class="edge" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="152" class="sub">distill</text>

  <!-- B. Extractor panel -->
  <g transform="translate(326,30)">
    <rect width="186" height="260" rx="10" fill="#fff" stroke="#111827" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="93" y="26" text-anchor="middle" class="title">B. Extractor</text>
    <text x="93" y="42" text-anchor="middle" class="sub">LLM + rule pass</text>

    <g transform="translate(18,60)">
      <rect width="150" height="26" rx="4" fill="#f1f5f9" stroke="#64748b"/>
      <text x="75" y="18" text-anchor="middle" class="body">segment turns</text>
    </g>
    <g transform="translate(18,94)">
      <rect width="150" height="26" rx="4" fill="#f1f5f9" stroke="#64748b"/>
      <text x="75" y="18" text-anchor="middle" class="body">classify (type / scope)</text>
    </g>
    <g transform="translate(18,128)">
      <rect width="150" height="26" rx="4" fill="#f1f5f9" stroke="#64748b"/>
      <text x="75" y="18" text-anchor="middle" class="body">abstract → template</text>
    </g>
    <g transform="translate(18,162)">
      <rect width="150" height="26" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="12" y="18" class="body">embed & tag</text>
    </g>
    <g transform="translate(18,196)">
      <rect width="150" height="26" rx="4" fill="#ffffff" stroke="#94a3b8"/>
      <text x="12" y="18" class="body">deduplicate</text>
    </g>
  </g>

  <!-- arrow B→C -->
  <path d="M 512 160 L 560 160" class="edge" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Panel C: typed experience points -->
  <g transform="translate(560,30)" font-size="10">
    <text class="title" x="110" y="0" text-anchor="middle">Experience points</text>
    <text class="sub" x="110" y="16" text-anchor="middle">typed, grounded, re-usable</text>

    <g transform="translate(0,32)">
      <rect width="220" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
      <text x="10" y="14" fill="#854d0e" font-weight="700">STRATEGY</text>
      <text x="10" y="28" fill="#1f2937">bisect failing test with pytest -x</text>
    </g>
    <g transform="translate(0,72)">
      <rect width="220" height="34" rx="6" fill="#ffedd5" stroke="#ea580c"/>
      <text x="8" y="15" font-weight="700" fill="#c2410c" font-size="10">PATTERN</text>
      <text x="8" y="28" font-size="9.5" fill="#431407">JWT refresh drops `alg` claim</text>
    </g>
    <g transform="translate(0,108)">
      <rect width="192" height="30" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="8" y="15" font-weight="700" fill="#5b21b6" font-size="10">PITFALL</text>
      <text x="8" y="28" font-size="9.5" fill="#1f2937">mocking `datetime.now` breaks TZ</text>
    </g>
    <g transform="translate(0,148)">
      <rect width="192" height="30" rx="5" fill="#d1fae5" stroke="#059669"/>
      <text x="8" y="15" font-weight="700" fill="#065f46" font-size="10">TOOL-USE</text>
      <text x="8" y="28" font-size="9.5" fill="#1f2937">prefer `pytest -x` for fail-fast</text>
    </g>
    <g transform="translate(0,188)">
      <rect width="192" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/>
      <text x="8" y="15" font-weight="700" fill="#1d4ed8" font-size="10">CODE SNIPPET</text>
      <text x="8" y="28" font-size="9" fill="#1f2937" font-family="JetBrains Mono,monospace">try: jwt.decode(...)</text>
    </g>
  </g>

  <!-- Arrows: A → B (solid thick), B → C (dashed) -->
  <path d="M300 180 C 322 180, 336 180, 360 180" class="edge" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M540 180 C 556 180, 568 180, 584 180" class="edge" fill="none" stroke="#374151" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
</body>
</html>
